name: Build proteomes, validate, and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 4 1 * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Unit tests
        run: npm test
      - name: Python syntax check
        run: python -m py_compile scripts/*.py
      - name: Build current UniProt human and mouse bundles
        run: python scripts/build_proteomes.py --species all --output data --cache .cache/uniprot --refresh
      - name: Independent BLASTP-short spot validation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ncbi-blast+
          python scripts/validate_blast.py --fasta .cache/uniprot/human.canonical.fasta.gz
          python scripts/validate_blast.py --fasta .cache/uniprot/mouse.canonical.fasta.gz
      - name: Stage static site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R css js docs data _site/
          cp README.md _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
